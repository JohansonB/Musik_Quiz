<!DOCTYPE html>
<html translate="no">
<head>
    <meta charset="UTF-8">
    <title>Context frame</title>
    <link rel="stylesheet" type="text/css" href="styles/navigation.css">
</head>
<body>
<div id = "main-container">
    <div id = "frame">
        <div id="levelList">
        <!-- Hier wird die Liste der Schüler angezeigt -->
        </div>
        <iframe id="iframe-container" frameborder="0" style="width: 100%;" ></iframe>
    </div>
    <div id= "outer">
    <button id = "toggler">Auswertung</button>
    <div id="commit-container">
        
        <button id = "back-button">Zurück</button>
        <p id = "count">0/n</p>
        <button id="commit-button">Weiter</button>
    </div>
    </div>
    <div id="popup-container">
        <div id="popup-content">
            <p class="popup-text">Möchtest du diese Aufgabe<br> wirklich überspringen?</p>
            <div id = "buttons-cont">
                <button id="NEIN-button">Nein</button>
                <button id="JA-button">Ja</button>
            </div>
        </div>
    </div>
</div>


</body>
<script  src="/scripts/utils.js" type="text/javascript"></script>
<script src="scripts/navigation.js" type="text/javascript"></script>




</html>
