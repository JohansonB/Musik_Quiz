<!DOCTYPE html>
<html translate="no">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="styles/posten3level6.css">
    <title>P3 Level 6</title>
</head>
<body id = "posten3level6b2b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<div id="main-container">
    <div id="piano-container">
        <p class="exercise-title">Noten erkennen (Bassschlüssel)</p>
        <p id = "desc-text">Schreibe die Note, die im Notenbild gezeigt wird, ins Textfeld.</p>
    </div>

    <div id="image-container">
        <svg width="300" height="250">
            <g transform="scale(1.2)">
                <!-- Erste Linie -->
                <line x1="0" y1="84" x2="200" y2="84" stroke="#000" stroke-width="2"></line>
                <!-- Zweite Linie -->
                <line x1="0" y1="105" x2="200" y2="105" stroke="#000" stroke-width="2"></line>
                <!-- Dritte Linie -->
                <line x1="0" y1="126" x2="200" y2="126" stroke="#000" stroke-width="2"></line>
                <!-- Vierte Linie -->
                <line x1="0" y1="147" x2="200" y2="147" stroke="#000" stroke-width="2"></line>
                <!-- Fünfte Linie -->
                <line x1="0" y1="168" x2="200" y2="168" stroke="#000" stroke-width="2"></line>
                
                <!-- Bassschlüssel -->
                <text x="12.6" y="105" style="font-size: 84px; font-family: 'Helsinki Std'; fill: #000;">?</text>

                <!-- Erster Takt Noten -->
                <text x="109.1" y="189" style="font-size: 79.4px; font-family: 'Helsinki Std';" class="normal">q</text>		
                <text x="85" y="178.5" style="font-size: 79.4px; font-family: 'Helsinki Std';" class="normal">b</text>
            </g>
        </svg>
        <input type="text" id="myTextField">

    </div>
</div>
<button id="help-button">hilfe</button>
<div id="popup-container">
    <div id="popup-content">
        <p id="popup-text">Achte darauf, dass du zwischen Violin- und Bassschlüssel unterscheidest. <br>Trage dann den Namen der Note ins Textfeld. Zum Beispiel: <strong>cis</strong> oder <strong>des</strong></p>
        <button id="close-button">Schließen</button>
    </div>
</div>
</div>
<script src="scripts/posten3level6.js" type="text/javascript"></script>
</body>

</html>
